<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Map</title>
		<!-- Shown inside other sites' iframes: no icon needed, so don't request one. -->
		<link rel="icon" href="data:," />
	</head>
	<body>
		<main class="embed">
			<div class="map-area">
				<div id="map" class="map" role="img" aria-label="Map"></div>
				<nav id="levels" class="levels" aria-label="Levels" hidden></nav>
			</div>
			<section class="directory" aria-labelledby="directory-heading">
				<h1 id="directory-heading" class="map-name">Loading map…</h1>
				<label class="search">
					<span>Find a place</span>
					<input id="search" type="search" autocomplete="off" disabled />
				</label>
				<label class="search" id="category-filter" hidden>
					<span>Category</span>
					<select id="category"><option value="">All</option></select>
				</label>
				<p id="results-count" class="count" role="status" aria-live="polite"></p>
				<ul id="results" class="results"></ul>
				<article id="details" class="details" aria-live="polite" hidden></article>
			</section>
		</main>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
