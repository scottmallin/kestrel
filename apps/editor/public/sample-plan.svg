  <g fill="#999" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="152" y="200">Unit 1</text><text x="376" y="200">Unit 2</text><text x="600" y="200">Unit 3</text>
    <text x="824" y="200">Unit 4</text><text x="1048" y="200">Unit 5</text>
    <text x="152" y="600">Unit 6</text><text x="376" y="600">Unit 7</text><text x="600" y="600">Unit 8</text>
